<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía de Inicio - Seroa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body, html { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        overflow: hidden; 
        background-color: #000; 
    }
    
    #carruselGuiaSeroa, .carousel-inner, .carousel-item { 
        height: 100vh; 
        width: 100vw;
    }

    .img-guia {
        width: 100vw;  
        height: 100vh; 
        object-fit: fill; 
        display: block; 
    }

    .carousel-indicators {
        bottom: 20px; 
    }
    .carousel-indicators [data-bs-target] { 
        background-color: #20c997; 
        width: 14px; 
        height: 14px; 
        border-radius: 50%; 
        opacity: 0.6;
        border: 2px solid white; 
    }
    .carousel-indicators .active {
        opacity: 1;
        background-color: #1aa179;
    }

    .btn-comenzar-container {
        position: absolute;
        bottom: 8%; 
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 10;
        padding: 0 20px; 
    }

    .btn-seroa { 
        background-color: #20c997; 
        color: white; 
        font-weight: bold; 
        padding: 18px 50px; 
        border-radius: 50px; 
        font-size: 1.4rem; 
        border: 3px solid white; 
        transition: 0.3s;
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .btn-seroa:hover { 
        background-color: #1aa179; 
        color: white; 
        transform: scale(1.05) translateY(-3px); 
        box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    .control-btn { 
        background-color: rgba(0, 0, 0, 0.4); 
        border-radius: 50%; 
        width: 60px; 
        height: 60px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        border: 2px solid white;
    }
    .carousel-control-prev, .carousel-control-next {
        width: 10%; 
    }
  </style>
</head>
<body>

<div id="carruselGuiaSeroa" class="carousel slide" data-bs-touch="true" data-bs-interval="false">
  
  <div class="carousel-indicators mb-4">
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="0" class="active" aria-current="true"></button>
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="2"></button>
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="3"></button>
  </div>

  <div class="carousel-inner">
    
    <div class="carousel-item active">
      <picture>
        <source media="(max-width: 768px)" srcset="img/guia-movil-1.png">
        <img src="img/guia-1.png" class="img-guia" alt="Bienvenida a Seroa">
      </picture>
    </div>

    <div class="carousel-item">
      <picture>
        <source media="(max-width: 768px)" srcset="img/guia-movil-2.png">
        <img src="img/guia-2.png" class="img-guia" alt="Dashboard en tiempo real">
      </picture>
    </div>

    <div class="carousel-item">
      <picture>
        <source media="(max-width: 768px)" srcset="img/guia-movil-3.png">
        <img src="img/guia-3.png" class="img-guia" alt="Gestión de pacientes">
      </picture>
    </div>

    <div class="carousel-item">
      <picture>
        <source media="(max-width: 768px)" srcset="img/guia-movil-4.png">
        <img src="img/guia-4.png" class="img-guia" alt="Reportes y Registro Diario">
      </picture>
      <div class="btn-comenzar-container">
        <a href="login.html" class="btn btn-seroa">¡Empezar Ahora!</a>
      </div>
    </div>

  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide="prev">
    <div class="control-btn"><i class="bi bi-chevron-left text-white fs-2"></i></div>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide="next">
    <div class="control-btn"><i class="bi bi-chevron-right text-white fs-2"></i></div>
    <span class="visually-hidden">Siguiente</span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
