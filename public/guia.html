<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía de Inicio - Seroa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body, html { height: 100%; margin: 0; background-color: #000; } /* Fondo negro para resaltar las imágenes */
    
    .carousel-item { 
        height: 100vh; 
        transition: transform 0.6s ease-in-out; 
    }

    /* Contenedor de la imagen para que siempre se vea bien */
    .img-guia {
        width: 100%;
        height: 100%;
        object-fit: contain; /* Esto evita que la imagen se corte */
        background-color: #f8fbfb; /* Color de fondo suave por si la imagen no llena todo el ancho */
    }

    .carousel-indicators [data-bs-target] { 
        background-color: #20c997; 
        width: 12px; 
        height: 12px; 
        border-radius: 50%; 
    }

    /* Botón final sobrepuesto */
    .btn-comenzar-container {
        position: absolute;
        bottom: 10%;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 10;
    }

    .btn-seroa { 
        background-color: #20c997; 
        color: white; 
        font-weight: bold; 
        padding: 15px 40px; 
        border-radius: 50px; 
        font-size: 1.3rem; 
        border: none; 
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn-seroa:hover { 
        background-color: #1aa179; 
        color: white; 
        transform: scale(1.05); 
    }

    .control-btn { 
        background-color: rgba(0, 0, 0, 0.2); 
        border-radius: 50%; 
        width: 50px; 
        height: 50px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
    }
  </style>
</head>
<body>

<div id="carruselGuiaSeroa" class="carousel slide" data-bs-touch="true" data-bs-interval="false">
  
  <div class="carousel-indicators mb-4">
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="2"></button>
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="3"></button>
  </div>

  <div class="carousel-inner">
    
    <div class="carousel-item active">
      <img src="img/guia-1.png" class="img-guia" alt="Bienvenida">
    </div>

    <div class="carousel-item">
      <img src="img/guia-2.png" class="img-guia" alt="Dashboard">
    </div>

    <div class="carousel-item">
      <img src="img/guia-3.png" class="img-guia" alt="Gestión">
    </div>

    <div class="carousel-item">
      <img src="img/guia-4.png" class="img-guia" alt="Reportes">
      <div class="btn-comenzar-container">
        <a href="login.html" class="btn btn-seroa">Comenzar y Entrar al Sistema</a>
      </div>
    </div>

  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide="prev">
    <div class="control-btn"><i class="bi bi-chevron-left text-white fs-3"></i></div>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide="next">
    <div class="control-btn"><i class="bi bi-chevron-right text-white fs-3"></i></div>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
