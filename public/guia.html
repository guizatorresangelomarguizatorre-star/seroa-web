<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía de Inicio - Seroa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    /* 1. RESETEO TOTAL PARA QUITAR BORDES */
    body, html { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        overflow: hidden; /* Evita barras de desplazamiento externas */
        background-color: #000; /* Fondo negro por seguridad, aunque no debería verse */
    }
    
    /* Contenedor principal del carrusel ocupando toda la ventana visual (Viewport) */
    #carruselGuiaSeroa, .carousel-inner, .carousel-item { 
        height: 100vh; 
        width: 100vw;
    }

    /* 2. EL CAMBIO MÁGICO PARA ESTIRAR LA IMAGEN */
    .img-guia {
        width: 100vw;  /* Ocupa el 100% del ancho de la ventana */
        height: 100vh; /* Ocupa el 100% del alto de la ventana */
        
        /* === IMPORTANTE ===
           object-fit: fill; estira la imagen para llenar el contenedor
           ignoring its aspect ratio. Esto elimina cualquier borde blanco. */
        object-fit: fill; 
        
        display: block; /* Quita espacios extra abajo */
    }

    /* Estilos de los indicadores (puntitos) */
    .carousel-indicators {
        bottom: 20px; /* Ajuste para que no choquen con el botón */
    }
    .carousel-indicators [data-bs-target] { 
        background-color: #20c997; 
        width: 14px; 
        height: 14px; 
        border-radius: 50%; 
        opacity: 0.6;
        border: 2px solid white; /* Borde para que se vean sobre cualquier imagen */
    }
    .carousel-indicators .active {
        opacity: 1;
        background-color: #1aa179;
    }

    /* Botón final sobrepuesto de forma elegante */
    .btn-comenzar-container {
        position: absolute;
        bottom: 8%; /* Posición desde abajo */
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 10;
        padding: 0 20px; /* Padding para móviles */
    }

    .btn-seroa { 
        background-color: #20c997; 
        color: white; 
        font-weight: bold; 
        padding: 18px 50px; 
        border-radius: 50px; 
        font-size: 1.4rem; 
        border: 3px solid white; /* Borde blanco para resaltar */
        transition: 0.3s;
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .btn-seroa:hover { 
        background-color: #1aa179; 
        color: white; 
        transform: scale(1.05) translateY(-3px); 
        box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    /* Controles laterales más visibles */
    .control-btn { 
        background-color: rgba(0, 0, 0, 0.4); /* Fondo más oscuro */
        border-radius: 50%; 
        width: 60px; 
        height: 60px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        border: 2px solid white;
    }
    .carousel-control-prev, .carousel-control-next {
        width: 10%; /* Área de clic más grande */
    }
  </style>
</head>
<body>

<div id="carruselGuiaSeroa" class="carousel slide carousel-fade" data-bs-touch="true" data-bs-interval="false">
  
  <div class="carousel-indicators mb-4">
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="2" aria-label="Slide 3"></button>
    <button type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide-to="3" aria-label="Slide 4"></button>
  </div>

  <div class="carousel-inner">
    
    <div class="carousel-item active">
      <img src="img/guia-1.png" class="img-guia" alt="Bienvenida a Seroa">
    </div>

    <div class="carousel-item">
      <img src="img/guia-2.png" class="img-guia" alt="Dashboard en tiempo real">
    </div>

    <div class="carousel-item">
      <img src="img/guia-3.png" class="img-guia" alt="Gestión de pacientes">
    </div>

    <div class="carousel-item">
      <img src="img/guia-4.png" class="img-guia" alt="Reportes y Registro Diario">
      <div class="btn-comenzar-container">
        <a href="login.html" class="btn btn-seroa">¡Empezar Ahora!</a>
      </div>
    </div>

  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide="prev">
    <div class="control-btn"><i class="bi bi-chevron-left text-white fs-2"></i></div>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carruselGuiaSeroa" data-bs-slide="next">
    <div class="control-btn"><i class="bi bi-chevron-right text-white fs-2"></i></div>
    <span class="visually-hidden">Siguiente</span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
