<header class="topbar-modern px-3 px-md-5 d-flex justify-content-between align-items-center">
    
    <div class="logo-wrapper d-flex align-items-center">
        <img src="img/logo-icono.png" alt="Seroa Icono" class="logo-icon me-2">
        <img src="img/letras-seroa.png" alt="Seroa Letras" class="logo-text">
    </div>

    <div class="header-controls">
        
        <a href="guia.html" class="btn-guia-header" title="Ver Guía de Inicio">
            <i class="bi bi-info-circle-fill me-2"></i>
            <span>Guía Seroa</span>
        </a>

        <div class="user-profile-badge">
            <div class="user-info-text me-2">
                <div class="user-name" id="nombreUsuarioHeader">Usuario</div>
                <div class="user-date" id="fecha"></div>
            </div>
            <i class="bi bi-person-circle avatar-icon"></i>
        </div>
      
        <a href="#" onclick="cerrarSesion()" class="btn-logout-header" title="Cerrar Sesión Segura">
            <i class="bi bi-box-arrow-right"></i>
        </a>

    </div>
</header>
