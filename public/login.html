<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seroa - Acceso</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="auth-container">
        <div id="login-section" class="form-section">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <input type="text" id="loginUser" placeholder="Usuario" pattern="[a-zA-Z0-9]+" title="Sin espacios ni caracteres especiales" required>
                <input type="password" id="loginPass" placeholder="Contraseña" required>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
            <p>¿No tienes cuenta? <a href="#" onclick="toggleForm('register')">Regístrate aquí</a></p>
        </div>

        <div id="register-section" class="form-section" style="display: none;">
            <h2>Registro de Paciente/Médico</h2>
            <form id="registerForm">
                <input type="text" id="regNombre" placeholder="Nombre completo" pattern="[a-zA-Z0-9 ]+" title="Solo letras, números y espacios" required>
                <input type="email" id="regEmail" placeholder="Correo electrónico" required>
               <input type="password" id="regPass" placeholder="Contraseña segura" title="Debe contener letras y números, y no incluir secuencias (ej. 123 o 321)" required>
                
                <div class="captcha-box">
                    <label id="captchaQuestion">¿Cuánto es X + Y?</label>
                    <input type="number" id="captchaAnswer" placeholder="Respuesta" required>
                </div>

                <button type="submit" class="btn-primary">Crear Cuenta</button>
            </form>
            <p>¿Ya tienes cuenta? <a href="#" onclick="toggleForm('login')">Inicia sesión</a></p>
        </div>
    </div>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
</body>
</html>
