<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seroa - Acceso Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="estilos.css">
    
    <style>
        /* === DISEÑO DE FONDO INMERSIVO === */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Degradado limpio y médico */
            background: linear-gradient(135deg, #f5f7fa 0%, #e4ecec 100%);
            position: relative;
            overflow: hidden;
        }

        /* Patrón maya integrado como textura base */
        .login-wrapper::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            background-image: url('img/patron-separador.png'); 
            background-repeat: repeat-x;
            background-position: center bottom;
            background-size: auto 50px;
            opacity: 0.12; 
            z-index: 0;
        }

        /* === TARJETA DE CRISTAL (GLASSMORPHISM) === */
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(59, 139, 136, 0.12);
            border-top: 6px solid var(--color-seroa-teal); /* Acento Seroa */
            padding: 3.5rem 3rem;
            width: 100%;
            max-width: 460px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 1;
        }

        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(59, 139, 136, 0.2);
        }

        /* === CAMPOS DE TEXTO CON ICONOS === */
        .input-group-text {
            background-color: #fcfcfc;
            border-color: #ced4da;
            color: var(--color-seroa-teal);
            border-radius: 12px 0 0 12px;
            font-size: 1.25rem;
            padding-left: 1.2rem;
        }
        
        .config-input-icon {
            border-radius: 0 12px 12px 0 !important;
            border-left: none; /* Une el icono con el input */
            padding-left: 0.75rem;
        }

        /* Efecto de brillo Seroa al hacer clic en el campo */
        .input-group:focus-within .input-group-text {
            border-color: var(--color-accent-green);
            color: var(--color-accent-green);
            background-color: #ffffff;
        }
        .form-control.config-input-icon:focus {
            border-color: var(--color-accent-green);
            box-shadow: none;
            background-color: #ffffff;
        }
        .input-group:focus-within {
            box-shadow: 0 0 0 0.25rem rgba(102, 187, 106, 0.2);
            border-radius: 12px;
        }

        /* === BOTÓN DE ACCIÓN PRINCIPAL === */
        .btn-seroa {
            background: linear-gradient(135deg, #309b9f, #6fc873);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 1.1rem;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(102, 187, 106, 0.25);
            margin-top: 1rem;
        }

        .btn-seroa:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 187, 106, 0.4);
            color: white;
        }

        /* === CAJA DE SEGURIDAD Y TEXTOS === */
        .captcha-box {
            background-color: rgba(59, 139, 136, 0.04);
            border-left: 4px solid var(--color-seroa-teal);
            border-radius: 10px;
        }
        
        .form-section-title {
            color: var(--color-seroa-dark);
            font-weight: 800;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>
    
    <div class="login-wrapper">
        <div class="auth-card">
            
            <div class="text-center mb-5 pb-1">
                <div class="d-flex justify-content-center align-items-center mb-2">
                    <img src="img/logo-icono.png" alt="Seroa Icono" height="75" class="me-2">
                    <img src="img/letras-seroa.png" alt="Seroa Letras" height="60">
                </div>
                <p class="text-muted mt-2 fw-medium" style="font-size: 0.95rem;">Panel de Monitoreo Inteligente</p>
            </div>
            
            <div id="login-section" class="form-section">
                <h4 class="text-center mb-4 form-section-title">Acceso Médico</h4>
                <form id="loginForm">
                    <div class="input-group mb-4">
                        <span class="input-group-text border-end-0"><i class="bi bi-envelope-fill"></i></span>
                        <input type="email" id="loginUser" class="form-control config-input config-input-icon" placeholder="Correo electrónico institucional" required>
                    </div>
                    <div class="input-group mb-4">
                        <span class="input-group-text border-end-0"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="loginPass" class="form-control config-input config-input-icon" placeholder="Contraseña de seguridad" required>
                    </div>
                    <button type="submit" class="btn w-100 btn-seroa">Ingresar al Sistema</button>
                </form>
                <p class="text-center mt-4 pt-2 text-muted">
                    ¿Personal médico nuevo? <br>
                    <a href="#" onclick="toggleForm('register')" class="text-decoration-none fw-bold mt-2 d-inline-block transition-transform" style="color: var(--color-accent-green); font-size: 1.05rem;">Solicita tu registro aquí</a>
                </p>
            </div>

            <div id="register-section" class="form-section" style="display: none;">
                <h4 class="text-center mb-4 form-section-title">Registro de Personal</h4>
                <form id="registerForm">
                    <div class="input-group mb-3">
                        <span class="input-group-text border-end-0"><i class="bi bi-person-badge-fill"></i></span>
                        <input type="text" id="regNombre" class="form-control config-input config-input-icon" placeholder="Nombre completo" pattern="[a-zA-Z0-9 ]+" title="Solo letras, números y espacios" required>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text border-end-0"><i class="bi bi-envelope-check-fill"></i></span>
                        <input type="email" id="regEmail" class="form-control config-input config-input-icon" placeholder="Correo institucional" required>
                    </div>
                    <div class="input-group mb-4">
                        <span class="input-group-text border-end-0"><i class="bi bi-shield-lock-fill"></i></span>
                        <input type="password" id="regPass" class="form-control config-input config-input-icon" placeholder="Contraseña segura" title="Debe contener letras y números, y no incluir secuencias (ej. 123 o 321)" required>
                    </div>
                    
                    <div class="mb-4 p-3 captcha-box text-center">
                        <label id="captchaQuestion" class="fw-bold mb-2 d-block text-teal">¿Cuánto es X + Y?</label>
                        <input type="number" id="captchaAnswer" class="form-control config-input text-center mx-auto shadow-sm" style="max-width: 140px; font-weight: bold; font-size: 1.1rem;" placeholder="Resultado" required>
                    </div>

                    <button type="submit" class="btn w-100 btn-seroa">Crear Credenciales</button>
                </form>
                <p class="text-center mt-4 pt-2 text-muted">
                    ¿Ya tienes tus accesos? <br>
                    <a href="#" onclick="toggleForm('login')" class="text-decoration-none fw-bold mt-2 d-inline-block transition-transform" style="color: var(--color-seroa-teal); font-size: 1.05rem;">Inicia sesión de forma segura</a>
                </p>
            </div>

        </div>
    </div>
    
    <script src="utils.js"></script>
    <script src="auth.js"></script>
</body>
</html>
