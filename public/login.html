<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seroa - Acceso Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    
    <div class="login-wrapper">
        <div class="auth-card">
            
            <div class="text-center mb-5 pb-1">
                <div class="d-flex justify-content-center align-items-center mb-2">
                    <img src="img/logo-icono.png" alt="Seroa Icono" height="75" class="me-2">
                    <img src="img/letras-seroa.png" alt="Seroa Letras" height="60">
                </div>
                <p class="text-muted mt-2 fw-medium" style="font-size: 0.95rem;">Panel de Monitoreo Inteligente</p>
            </div>
            
            <div id="login-section" class="form-section">
                <h4 class="text-center mb-4 form-section-title">Acceso Médico</h4>
                <form id="loginForm">
                    <div class="input-group mb-4">
                        <span class="input-group-text border-end-0"><i class="bi bi-envelope-fill"></i></span>
                        <input type="email" id="loginUser" class="form-control config-input config-input-icon" placeholder="Correo electrónico institucional" required>
                    </div>
                    
                    <div class="input-group mb-4">
                        <span class="input-group-text border-end-0"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="loginPass" class="form-control config-input config-input-pass" placeholder="Contraseña de seguridad" required>
                        <button class="btn btn-outline-secondary btn-toggle-pass" type="button" onclick="togglePassword('loginPass', this)">
                            <i class="bi bi-eye-slash-fill"></i>
                        </button>
                    </div>

                    <button type="submit" class="btn w-100 btn-seroa">Ingresar al Sistema</button>
                </form>
                <p class="text-center mt-4 pt-2 text-muted">
                    ¿Personal médico nuevo? <br>
                    <a href="#" onclick="toggleForm('register')" class="text-decoration-none fw-bold mt-2 d-inline-block transition-transform" style="color: var(--color-accent-green); font-size: 1.05rem;">Solicita tu registro aquí</a>
                </p>
            </div>

            <div id="register-section" class="form-section" style="display: none;">
                <h4 class="text-center mb-4 form-section-title">Registro de Personal</h4>
                <form id="registerForm">
                    <div class="input-group mb-3">
                        <span class="input-group-text border-end-0"><i class="bi bi-person-badge-fill"></i></span>
                        <input type="text" id="regNombre" class="form-control config-input config-input-icon" placeholder="Nombre completo" pattern="[a-zA-Z0-9 ]+" title="Solo letras, números y espacios" required>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text border-end-0"><i class="bi bi-envelope-check-fill"></i></span>
                        <input type="email" id="regEmail" class="form-control config-input config-input-icon" placeholder="Correo" required>
                    </div>
                    
                    <div class="input-group mb-4">
                        <span class="input-group-text border-end-0"><i class="bi bi-shield-lock-fill"></i></span>
                        <input type="password" id="regPass" class="form-control config-input config-input-pass" placeholder="Contraseña" title="Debe contener letras y números, y no incluir secuencias (ej. 123 o 321)" required>
                        <button class="btn btn-outline-secondary btn-toggle-pass" type="button" onclick="togglePassword('regPass', this)">
                            <i class="bi bi-eye-slash-fill"></i>
                        </button>
                    </div>
                    
                    <div class="mb-4 p-3 captcha-box text-center">
                        <label id="captchaQuestion" class="fw-bold mb-2 d-block text-teal">¿Cuánto es X + Y?</label>
                        <input type="number" id="captchaAnswer" class="form-control config-input text-center mx-auto shadow-sm" style="max-width: 140px; font-weight: bold; font-size: 1.1rem;" placeholder="Resultado" required>
                    </div>

                    <button type="submit" class="btn w-100 btn-seroa">Crear Credenciales</button>
                </form>
                <p class="text-center mt-4 pt-2 text-muted">
                    ¿Ya tienes tus accesos? <br>
                    <a href="#" onclick="toggleForm('login')" class="text-decoration-none fw-bold mt-2 d-inline-block transition-transform" style="color: var(--color-seroa-teal); font-size: 1.05rem;">Inicia sesión de forma segura</a>
                </p>
            </div>

        </div>
    </div>
    
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    
    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove('bi-eye-slash-fill');
                icon.classList.add('bi-eye-fill');
            } else {
                input.type = "password";
                icon.classList.remove('bi-eye-fill');
                icon.classList.add('bi-eye-slash-fill');
            }
        }
    </script>
</body>
</html>
